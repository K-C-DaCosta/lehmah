[package]
name = "oxypress_client_web"
version = "0.1.0"
edition = "2024"


[dependencies]
cfg-if = "1.0.4"
oxypress_core = { path = "../oxypress_core" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
bitflags = "2.5.0"
yew = { version = "0.21", features = ["csr"] }
web-sys = { version = "0.3.80", features = [
    'Selection',
    'Window',
    'TreeWalker',
    'NodeFilter',
] }

[build-dependencies]
oxypress_core = { path = "../oxypress_core" }
chrono = "0.4.42"
