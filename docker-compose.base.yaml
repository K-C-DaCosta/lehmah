services:
  oxypress_web_server:
    image: oxypress_web_server
    build:
      context: .
      dockerfile: services/oxypress_web_server/Dockerfile
    env_file:
      - /env/.env.oxypress_web_server.template
    ports:
      - "80:8080"
      - "443:8081"
    environment:
      DATABASE_URL: postgres://postgres:example@oxypress_web_server_db:5432/postgres
    depends_on:
      - oxypress_web_server_db
  oxypress_web_server_db:
    image: oxypress_web_server_db
    build:
      context: ./services/oxypress_web_server_db 
      dockerfile: ./Dockerfile
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: example
    ports:
      - "5432:5432"
